<section class="academy-container">

  <header class="academy-hero">
    <h2>
      Bienvenido a tu Academia ProScience,
      <span class="user-name">{{ user?.firstName }}</span>
    </h2>
    <p class="academy-subtitle">
      Continúa tu proceso de formación y certificación
    </p>
  </header>

  <nav class="academy-nav">
    <a routerLink="pending" routerLinkActive="active">Pendientes</a>
    <a  routerLink="completed" routerLinkActive="active">Completados</a>
    <a routerLink="certificates" routerLinkActive="active">Certificados</a>
  </nav>



  @if (showIntroVideo) {
    <div class="academy-video">
      <iframe
        src="assets/videos/VIdeoHome.mp4">
      </iframe>
    </div>
  }

  <section class="academy-content">
    <router-outlet />
  </section>

</section>
